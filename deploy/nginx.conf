# Hindustan Electric web server. deploy/setup.sh fills in __DOMAIN__, __APP__ and __ACME__.
# The React app is served as files; /api and /admin go to Django (gunicorn on 127.0.0.1:8001).

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    location /.well-known/acme-challenge/ { root __ACME__; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # "listen … http2" (not "http2 on;"): Ubuntu 24.04 ships nginx 1.24.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 12m;  # the app accepts purchase bill photos up to 10 MB

    root __APP__/frontend/build;

    # Django: the API and the back office.
    location ~ ^/(api|admin)(/|$) {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location /static/ {
        alias __APP__/backend/staticfiles/;
        expires 7d;
    }

    # Built files have a content hash in their names, so they can be kept for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is the React app; its own pages load on refresh too.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }
}
